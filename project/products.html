<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Browse smartphones, laptops, tablets, and accessories at Miracle Tech Store.">

    <meta name="author" content="Chisom Miracle Omeja">

    <title>Miracle Tech Store | Products</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/store.css">
    <script src="scripts/store.js" defer></script>
</head>

<body>

    <header>

        <a href="index.html">
            <img src="images/logo-square.webp" alt="Miracle Tech Store logo" width="480" height="147">
        </a>
        <h1>MIRACLE TECH STORE</h1>

        <button id="menu-button" aria-label="Open navigation menu">
            ☰
        </button>

        <nav id="navigation">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <main>

        <!-- Page Heading -->
        <section class="page-heading">

            <h1>Our Products</h1>

            <p>
                Explore our selection of quality technology products
                for work, learning, communication, and entertainment.
            </p>

        </section>

        <!--Cart Button-->

        <div class="cart-button-container">
            <a href="cart.html" class="cart-button">Cart <span id="cart-count">0</span></a>
        </div>

        <!-- Product Filters -->
        <section class="product-filters">

            <h2>Browse Products</h2>
            <label for="product-search">Search Product</label>
            <input type="search" id="product-search" placeholder="Search by product, brand, or specification..."
                autocomplete="off">

            <div class="filter-buttons">

                <button type="button" data-category="All">
                    All
                </button>

                <button type="button" data-category="Smartphones">
                    Smartphones
                </button>

                <button type="button" data-category="Laptops">
                    Laptops
                </button>

                <button type="button" data-category="Tablets">
                    Tablets
                </button>

                <button type="button" data-category="Accessories">
                    Accessories
                </button>

            </div>

        </section>

        <!--Products-->
        <section class="product-section">
            <h2 id="product-heading">All Products</h2>
            <div class="product-container">

            </div>
        </section>

    </main>

    <footer>

        <p><a href="contact.html">Contact |</a></p>
        <p><a href="references.html">References |</a></p>
        <p>&copy; <span id="currentyear"></span>
            Miracle Tech Store
        </p>


    </footer>

</body>

</html>
