<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form">
    <meta name="author" content="chisom Miracle Omeja">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Choose a Product</option>
            </select>

            <p>Overall Rating</p>
            <label>
                <input type="radio" name="rating" value="1" required>☆
            </label>
            <label>
                <input type="radio" name="rating" value="2" required>☆☆
            </label>
            <label>
                <input type="radio" name="rating" value="3" required>☆☆☆
            </label>
            <label>
                <input type="radio" name="rating" value="4" required>☆☆☆☆
            </label>
            <label>
                <input type="radio" name="rating" value="5" required>☆☆☆☆☆
            </label>

            <label for="installDate">Date of installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <p>Which features did you find useful in the product?</p>
            <p><em>(Check all that apply)</em></p>

            <label>
                <input type="checkbox" id="durability" name="features" value="durability">Durability
            </label>
            <label>
                <input type="checkbox" id="ease-of-use" name="features" value="ease-of-use">Ease of Use
            </label>
            <label>
                <input type="checkbox" id="performance" name="features" value="performance">Performance
            </label>
            <label>
                <input type="checkbox" id="design" name="features" value="design">Design
            </label>

            <label for="review">Written Review<em>(optional)</em></label>
            <textarea id="review" name="review"></textarea>

            <label for="userName">Your Name<em>(Optional)</em></label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Post Review">


        </form>
    </main>
    <footer>
        <p>
            &copy; <span id="currentyear"></span> 🌺 Chisom Miracle Omeja 🌺 Nigeria
        </p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
